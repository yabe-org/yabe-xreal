plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

android {
    namespace = getProject().property("unity.namespace")
    compileSdk = getProject().property("unity.compileSdkVersion") as Integer

    buildFeatures {
        aidl = true
    }

    defaultConfig {
        minSdk = getProject().property("unity.minSdkVersion") as Integer
        targetSdk = getProject().property("unity.targetSdkVersion") as Integer
        ndk {
            abiFilters.addAll(getProject().property("unity.abiFilters").tokenize(','))
            debugSymbolLevel = getProject().property("unity.debugSymbolLevel")
        }
        versionCode = getProject().property("unity.versionCode") as Integer
        versionName = getProject().property("unity.versionName")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
